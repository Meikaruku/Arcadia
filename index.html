<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Bunny FX</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; overflow-x: hidden; position: relative; }
    
    /* Interactive Canvas Overlay */
    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Screen Punch Knockback Animation */
    @keyframes punchShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-18px, 12px) rotate(-4deg); }
      40% { transform: translate(18px, -12px) rotate(4deg); }
      60% { transform: translate(-12px, -6px) rotate(-2deg); }
      80% { transform: translate(12px, 6px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .punch-shake {
      animation: punchShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    .hidden { display: none !important; }
    button { cursor: pointer; border: none; background: var(--accent); color: white; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    input { background: #0f172a; border: 1px solid #334155; color: white; padding: 0.6rem; border-radius: 6px; width: 100%; margin-top: 0.3rem; margin-bottom: 1rem; }
    
    /* Login Screen & Logo Area */
    .auth-container { max-width: 420px; margin: auto; padding: 2.5rem; background: var(--card-bg); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; position: relative; z-index: 10; transition: transform 0.1s ease-out; }
    .login-logo-wrapper { text-align: center; margin-bottom: 1rem; }
    .login-logo-img { max-width: 160px; max-height: 120px; object-fit: contain; display: inline-block; }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }
  </style>
</head>
<body>

  <!-- FX CANVAS FOR PARTICLES & BUNNY CHASER -->
  <canvas id="fx-canvas"></canvas>

  <!-- LOGIN VIEW -->
  <div id="view-login" class="auth-container">
    <div id="login-logo-container" class="login-logo-wrapper hidden">
      <img id="login-logo" class="login-logo-img" alt="Guild Logo">
    </div>
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Arcadia Guild Portal</h2>
    <form id="login-form">
      <label>Email Address</label>
      <input type="email" id="login-email" required placeholder="user@domain.com" autocomplete="email">
      <label>Password</label>
      <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
      <button type="submit" id="login-btn" style="width:100%; margin-top: 0.5rem;">Sign In</button>
      <div id="login-error" class="error-msg"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUYjwcenaxn5aLxCeISOfwYJTRJx_Oop4",
      authDomain: "arcadia-8bb67.firebaseapp.com",
      projectId: "arcadia-8bb67",
      storageBucket: "arcadia-8bb67.firebasestorage.app",
      messagingSenderId: "800998244719",
      appId: "1:800998244719:web:e72bfe3d2b57c4a70aa89a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isUserLoggedIn = false;
    let loginStartTime = Date.now();

    // Firebase Auth State Listener
    onAuthStateChanged(auth, (user) => {
      if (user) {
        isUserLoggedIn = true;
        document.getElementById('view-login').classList.add('hidden');
        if (window.clearFXCanvas) window.clearFXCanvas();
      } else {
        isUserLoggedIn = false;
        loginStartTime = Date.now();
        document.getElementById('view-login').classList.remove('hidden');
        if (window.resetFXCanvas) window.resetFXCanvas();
      }
    });

    // Login Submission Handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loginBtn = document.getElementById('login-btn');
      const errBox = document.getElementById('login-error');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      errBox.innerText = '';
      loginBtn.disabled = true;
      loginBtn.innerText = 'Signing In...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        errBox.innerText = error.message.replace("Firebase: ", "");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'Sign In';
      }
    });

    // INTERACTIVE CANVAS (BUNNY CHASER & PARTICLES)
    (function initCanvasFX() {
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const rawMouse = { x: width / 2, y: height / 2 };
      const cursorOffset = { x: 0, y: 0 };
      let particles = [];
      let punchImpacts = [];
      let bunnies = [];

      function createInitialBunny() {
        return {
          x: width / 2 - 120,
          y: height / 2 - 120,
          vx: 0,
          vy: 0,
          speed: 0.045,
          state: 'chasing',
          lastPunchTime: 0
        };
      }

      bunnies = [createInitialBunny()];

      window.clearFXCanvas = function() {
        particles = [];
        punchImpacts = [];
        bunnies = [];
        ctx.clearRect(0, 0, width, height);
      };

      window.resetFXCanvas = function() {
        particles = [];
        punchImpacts = [];
        bunnies = [createInitialBunny()];
      };

      window.addEventListener('mousemove', (e) => {
        if (isUserLoggedIn) return;
        rawMouse.x = e.clientX;
        rawMouse.y = e.clientY;
      });

      // Click to Kick Bunny Mechanic
      window.addEventListener('mousedown', (e) => {
        if (isUserLoggedIn) return;
        const clickX = e.clientX;
        const clickY = e.clientY;

        for (let i = bunnies.length - 1; i >= 0; i--) {
          const b = bunnies[i];
          if (b.state !== 'chasing') continue;

          const dist = Math.hypot(clickX - b.x, clickY - b.y);
          if (dist < 46) {
            b.state = 'kicked';
            const angle = Math.atan2(b.y - clickY, b.x - clickX);
            const force = 22 + Math.random() * 8;
            b.vx = Math.cos(angle) * force;
            b.vy = Math.sin(angle) * force - 14;
            b.rotation = 0;
            b.vRot = (Math.random() - 0.5) * 0.6;

            punchImpacts.push({ x: b.x, y: b.y, text: '💥 POW!', life: 25, color: '#f59e0b' });
            for (let p = 0; p < 20; p++) {
              particles.push({
                x: b.x, y: b.y,
                vx: (Math.random() - 0.5) * 16,
                vy: (Math.random() - 0.5) * 16,
                size: Math.random() * 6 + 3,
                color: '#f59e0b',
                alpha: 1
              });
            }
            break;
          }
        }
      });

      // Spawn bunnies over time
      function spawnBunny() {
        if (isUserLoggedIn || bunnies.length >= 10) return;
        let x, y;
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { x = Math.random() * width; y = -50; }
        else if (edge === 1) { x = width + 50; y = Math.random() * height; }
        else if (edge === 2) { x = Math.random() * width; y = height + 50; }
        else { x = -50; y = Math.random() * height; }

        bunnies.push({
          x: x, y: y, vx: 0, vy: 0,
          speed: 0.035 + Math.random() * 0.025,
          state: 'chasing',
          lastPunchTime: 0
        });
      }

      setInterval(spawnBunny, 10000);

      function triggerPunchEffect(bunnyX, bunnyY, targetX, targetY) {
        const authContainer = document.querySelector('.auth-container');
        const angle = Math.atan2(targetY - bunnyY, targetX - bunnyX);
        const pushForce = 150;
        cursorOffset.x += Math.cos(angle) * pushForce;
        cursorOffset.y += Math.sin(angle) * pushForce;

        if (authContainer) {
          authContainer.classList.add('punch-shake');
          setTimeout(() => authContainer.classList.remove('punch-shake'), 350);
        }

        punchImpacts.push({ x: targetX, y: targetY, text: '🥊 PUNCH!', life: 22, color: '#ef4444' });
        for (let i = 0; i < 22; i++) {
          particles.push({
            x: targetX, y: targetY,
            vx: Math.cos(angle) * (8 + Math.random() * 12) + (Math.random() - 0.5) * 6,
            vy: Math.sin(angle) * (8 + Math.random() * 12) + (Math.random() - 0.5) * 6,
            size: Math.random() * 6 + 3,
            color: '#ef4444',
            alpha: 1
          });
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        if (isUserLoggedIn) {
          requestAnimationFrame(animate);
          return;
        }

        cursorOffset.x *= 0.84;
        cursorOffset.y *= 0.84;

        const effectiveMouseX = rawMouse.x + cursorOffset.x;
        const effectiveMouseY = rawMouse.y + cursorOffset.y;

        // Trail particles
        if (Math.random() > 0.3) {
          particles.push({
            x: effectiveMouseX, y: effectiveMouseY,
            vx: (Math.random() - 0.5) * 2.5,
            vy: (Math.random() - 0.5) * 2.5,
            size: Math.random() * 4 + 2,
            color: `hsl(${Math.random() * 50 + 230}, 90%, 75%)`,
            alpha: 1
          });
        }

        // Reticle on displacement
        const offsetDist = Math.hypot(cursorOffset.x, cursorOffset.y);
        if (offsetDist > 8) {
          ctx.save();
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(effectiveMouseX, effectiveMouseY, 14, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        const canPunch = (Date.now() - loginStartTime) / 1000 >= 5;

        // Render particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy;
          p.alpha -= 0.025;
          if (p.alpha <= 0) { particles.splice(i, 1); continue; }

          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Render punch text
        for (let i = punchImpacts.length - 1; i >= 0; i--) {
          const imp = punchImpacts[i];
          ctx.save();
          ctx.font = '900 24px "Segoe UI", sans-serif';
          ctx.fillStyle = imp.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = imp.color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(imp.text, imp.x, imp.y - (25 - imp.life));
          ctx.restore();
          
          imp.life--;
          if (imp.life <= 0) punchImpacts.splice(i, 1);
        }

        // Render & Update Bunnies
        for (let i = bunnies.length - 1; i >= 0; i--) {
          const b = bunnies[i];

          if (b.state === 'chasing') {
            b.x += (effectiveMouseX - b.x) * b.speed;
            b.y += (effectiveMouseY - b.y) * b.speed;
            const dist = Math.hypot(effectiveMouseX - b.x, effectiveMouseY - b.y);

            if (dist < 32 && canPunch && (Date.now() - b.lastPunchTime > 800)) {
              b.lastPunchTime = Date.now();
              const angle = Math.atan2(b.y - effectiveMouseY, b.x - effectiveMouseX);
              b.x += Math.cos(angle) * 40;
              b.y += Math.sin(angle) * 40;
              triggerPunchEffect(b.x, b.y, effectiveMouseX, effectiveMouseY);
            }

            ctx.save();
            ctx.font = '36px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const hopOffset = Math.abs(Math.sin(Date.now() / 140)) * 6;

            if (effectiveMouseX < b.x) {
              ctx.translate(b.x, b.y - hopOffset);
              ctx.scale(-1, 1);
              ctx.fillText('🐇', 0, 0);
            } else {
              ctx.fillText('🐇', b.x, b.y - hopOffset);
            }
            ctx.restore();

          } else if (b.state === 'kicked') {
            b.x += b.vx; b.y += b.vy;
            b.vy += 0.75;
            b.rotation = (b.rotation || 0) + (b.vRot || 0.2);

            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rotation);
            ctx.font = '36px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐇', 0, 0);
            ctx.restore();

            if (b.y > height + 100 || b.x < -100 || b.x > width + 100) {
              bunnies.splice(i, 1);
            }
          }
        }

        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
</html>
