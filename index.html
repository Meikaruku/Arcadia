<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Username & Role Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ccc; padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 8px; }
    .hidden { display: none; }
    label { display: block; margin-top: 0.5rem; font-weight: bold; }
    input, select, button { margin-top: 0.25rem; padding: 0.5rem; width: 100%; box-sizing: border-box; }
    button { margin-top: 1rem; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px;}
    button:hover { background-color: #0056b3; }
    .user-row { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #eee; padding: 0.5rem 0; }
    .user-row select, .user-row input { width: auto; flex: 1; }
  </style>
</head>
<body>

  <h1>App Portal</h1>

  <!-- Auth Section -->
  <div id="auth-section" class="card">
    <h2>Login / Sign Up</h2>
    <label>Username</label>
    <input type="text" id="username-input" placeholder="e.g. hero99" />
    
    <label>Password</label>
    <input type="password" id="password-input" placeholder="••••••••" />

    <button id="btn-login">Log In</button>
    <button id="btn-signup" style="background-color: #28a745;">Register New Account</button>
    <button id="btn-forgot" style="background-color: #6c757d;">Forgot Password?</button>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard-section" class="card hidden">
    <h2>Welcome, <span id="display-username"></span>!</h2>
    <p><strong>System Role:</strong> <span id="display-system-role"></span></p>
    <p><strong>Guild Role:</strong> <span id="display-guild-role"></span></p>

    <hr>

    <h3>Account Security</h3>
    <label>New Password</label>
    <input type="password" id="new-password-input" placeholder="New Password" />
    <button id="btn-update-password">Update Password</button>

    <button id="btn-logout" style="background-color: #dc3545;">Log Out</button>
  </div>

  <!-- Admin Panel Section -->
  <div id="admin-section" class="card hidden">
    <h2>User Role Management</h2>
    <div id="user-list">Loading users...</div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      updatePassword, 
      sendPasswordResetEmail,
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      getDocs, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Helper: Map pure username to internal email domain
    const formatToEmail = (username) => {
      const clean = username.trim().toLowerCase();
      return clean.includes('@') ? clean : `${clean}@app.internal`;
    };

    let currentUserData = null;

    // 2. Auth State Observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Fetch User Document from Firestore
        const userDocRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userDocRef);

        if (userSnap.exists()) {
          currentUserData = { uid: user.uid, ...userSnap.data() };
          
          // Display User Info
          document.getElementById('display-username').textContent = currentUserData.username;
          document.getElementById('display-system-role').textContent = currentUserData.systemRole;
          document.getElementById('display-guild-role').textContent = currentUserData.guildRole;

          // Toggle Panels
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('dashboard-section').classList.remove('hidden');

          // Render Admin Panel if User Has Privileges
          const isAdminRole = ['Super Admin', 'System Admin', 'Admin'].includes(currentUserData.systemRole);
          if (isAdminRole) {
            document.getElementById('admin-section').classList.remove('hidden');
            loadAllUsers();
          } else {
            document.getElementById('admin-section').classList.add('hidden');
          }
        }
      } else {
        currentUserData = null;
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('admin-section').classList.add('hidden');
      }
    });

    // 3. User Registration
    document.getElementById('btn-signup').addEventListener('click', async () => {
      const rawUser = document.getElementById('username-input').value;
      const pass = document.getElementById('password-input').value;
      const email = formatToEmail(rawUser);

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        // Default roles assigned upon creation
        await setDoc(doc(db, "users", cred.user.uid), {
          username: rawUser.trim(),
          email: email,
          systemRole: "User",
          guildRole: "Member"
        });
        alert("Account registered successfully!");
      } catch (err) {
        alert(err.message);
      }
    });

    // 4. User Login
    document.getElementById('btn-login').addEventListener('click', async () => {
      const rawUser = document.getElementById('username-input').value;
      const pass = document.getElementById('password-input').value;
      const email = formatToEmail(rawUser);

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    });

    // 5. Password Reset (Forgot Password)
    document.getElementById('btn-forgot').addEventListener('click', async () => {
      const rawUser = document.getElementById('username-input').value;
      if (!rawUser) return alert("Please type your username in the box first.");
      
      const email = formatToEmail(rawUser);
      try {
        await sendPasswordResetEmail(auth, email);
        alert(`Password reset request processed for ${rawUser}.`);
      } catch (err) {
        alert("Error sending reset email: " + err.message);
      }
    });

    // 6. Update Password (Logged-In User)
    document.getElementById('btn-update-password').addEventListener('click', async () => {
      const newPass = document.getElementById('new-password-input').value;
      if (!newPass) return alert("Enter a new password.");

      try {
        await updatePassword(auth.currentUser, newPass);
        alert("Password updated successfully!");
        document.getElementById('new-password-input').value = "";
      } catch (err) {
        if (err.code === 'auth/requires-recent-login') {
          alert("Security timeout: Please log out and log back in to change your password.");
        } else {
          alert(err.message);
        }
      }
    });

    // 7. Logout
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // 8. Admin Panel: Fetch & Render User List
    async function loadAllUsers() {
      const container = document.getElementById('user-list');
      container.innerHTML = "Loading...";

      const querySnapshot = await getDocs(collection(db, "users"));
      container.innerHTML = "";

      querySnapshot.forEach((userDoc) => {
        const targetUser = { id: userDoc.id, ...userDoc.data() };
        
        const row = document.createElement('div');
        row.className = 'user-row';
        row.innerHTML = `
          <strong style="width: 120px;">${targetUser.username}</strong>
          
          <select id="sys-role-${targetUser.id}">
            <option value="User" ${targetUser.systemRole === 'User' ? 'selected' : ''}>User</option>
            <option value="Admin" ${targetUser.systemRole === 'Admin' ? 'selected' : ''}>Admin</option>
            <option value="System Admin" ${targetUser.systemRole === 'System Admin' ? 'selected' : ''}>System Admin</option>
            <option value="Super Admin" ${targetUser.systemRole === 'Super Admin' ? 'selected' : ''}>Super Admin</option>
          </select>

          <input type="text" id="guild-role-${targetUser.id}" value="${targetUser.guildRole || ''}" placeholder="Guild Role" />
          
          <button style="width: auto; margin:0;" id="btn-save-${targetUser.id}">Save</button>
        `;

        container.appendChild(row);

        // Bind update event with permission logic
        document.getElementById(`btn-save-${targetUser.id}`).addEventListener('click', () => {
          updateUserRole(targetUser);
        });
      });
    }

    // 9. Role Update Logic (Enforces Super Admin Protection)
    async function updateUserRole(targetUser) {
      const callerRole = currentUserData.systemRole;
      const targetCurrentRole = targetUser.systemRole;

      // Rule Check: System Admins & Admins cannot modify a Super Admin
      if (targetCurrentRole === 'Super Admin' && callerRole !== 'Super Admin') {
        alert("Permission Denied: Only a Super Admin can modify another Super Admin's roles.");
        return;
      }

      const newSystemRole = document.getElementById(`sys-role-${targetUser.id}`).value;
      const newGuildRole = document.getElementById(`guild-role-${targetUser.id}`).value;

      // Rule Check: Non-Super Admins cannot promote anyone TO Super Admin
      if (newSystemRole === 'Super Admin' && callerRole !== 'Super Admin') {
        alert("Permission Denied: Only a Super Admin can grant the Super Admin role.");
        return;
      }

      try {
        await updateDoc(doc(db, "users", targetUser.id), {
          systemRole: newSystemRole,
          guildRole: newGuildRole
        });
        alert(`Roles updated for ${targetUser.username}!`);
        loadAllUsers(); // Refresh UI
      } catch (err) {
        alert("Failed to update roles: " + err.message);
      }
    }
  </script>
</body>
</html>
