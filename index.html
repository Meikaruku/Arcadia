<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcadia Guild Portal</title>

  <!-- Firebase v10 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* Screen Management */
    .screen { display: none; height: 100vh; width: 100vw; }
    .screen.active { display: flex; }

    /* LOGIN PAGE & MINIGAME */
    #login-screen {
      position: relative;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      overflow: hidden;
    }

    /* Particle Trail Canvas */
    #cursor-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 8;
    }

    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-card h2 { margin-bottom: 1.5rem; color: #a5b4fc; letter-spacing: 1px; }

    .input-group { margin-bottom: 1.25rem; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    
    .domain-input {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .domain-input input {
      border: none;
      outline: none;
      background: transparent;
      padding: 0.75rem;
      color: #fff;
      flex: 1;
      width: 100%;
    }
    .domain-addon {
      background: #334155;
      color: var(--text-muted);
      padding: 0.75rem 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }

    /* Scoreboard */
    .score-board {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 1rem;
      font-weight: bold;
      z-index: 10;
      color: #facc15;
    }

    /* Intense Angry Bunny FX */
    @keyframes angryVibrate {
      0% { transform: scale(1.1) translate(0, 0) rotate(0deg); }
      20% { transform: scale(1.25) translate(-3px, 3px) rotate(-10deg); }
      40% { transform: scale(1.15) translate(3px, -3px) rotate(10deg); }
      60% { transform: scale(1.3) translate(-2px, -2px) rotate(-6deg); }
      80% { transform: scale(1.2) translate(2px, 2px) rotate(6deg); }
      100% { transform: scale(1.1) translate(0, 0) rotate(0deg); }
    }

    .bunny {
      position: absolute;
      width: 42px;
      height: 42px;
      font-size: 34px;
      user-select: none;
      cursor: pointer;
      z-index: 5;
      line-height: 42px;
      text-align: center;
      animation: angryVibrate 0.1s infinite linear;
      filter: drop-shadow(0 0 14px #ff0055) drop-shadow(0 0 6px #ff0000);
      transition: filter 0.2s;
    }

    .bunny.launched {
      animation: none;
      filter: drop-shadow(0 0 16px #facc15);
    }

    /* MAIN APP LAYOUT */
    #app-screen { display: none; width: 100vw; height: 100vh; }

    .sidebar {
      width: 250px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 1rem;
    }

    .nav-group { display: flex; flex-direction: column; gap: 0.5rem; }
    
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      text-align: left;
      width: 100%;
    }
    .nav-btn:hover, .nav-btn.active {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
    }

    .logout-btn { color: var(--danger); margin-top: auto; }
    .logout-btn:hover { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem;
      background: var(--bg-primary);
    }

    /* Homepage View */
    .home-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .guild-logo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--accent);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
      margin-bottom: 1.5rem;
    }

    .welcome-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      line-height: 1.6;
      font-size: 1.1rem;
    }

    /* Settings View */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .settings-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .settings-card h3 { margin-bottom: 1rem; color: #a5b4fc; }

    textarea {
      width: 100%;
      height: 100px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      padding: 0.75rem;
      margin-bottom: 1rem;
      resize: vertical;
    }

    .user-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .user-table th, .user-table td {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 0.9rem;
    }

    select {
      background: #0f172a;
      color: #fff;
      border: 1px solid var(--border);
      padding: 0.4rem;
      border-radius: 4px;
    }

    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { width: auto; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="screen active">
    <canvas id="cursor-canvas"></canvas>
    <div class="score-board">Bunnies Defeated: <span id="bunny-score">0</span></div>
    
    <div class="login-card" id="login-card">
      <h2>Arcadia Portal</h2>
      <form id="login-form">
        <div class="input-group">
          <label>Username</label>
          <div class="domain-input">
            <input type="text" id="login-username" placeholder="username" required>
            <span class="domain-addon">@arcadia.com</span>
          </div>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="screen">
    <aside class="sidebar">
      <div class="nav-group">
        <button class="nav-btn active" id="nav-home" onclick="showView('home')">🏠 Homepage</button>
        <button class="nav-btn" id="nav-settings" style="display: none;" onclick="showView('settings')">⚙️ Settings</button>
      </div>
      <button class="nav-btn logout-btn" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="main-content">
      <!-- HOMEPAGE VIEW -->
      <section id="view-home" class="home-container">
        <img id="display-logo" class="guild-logo" src="https://via.placeholder.com/180?text=Arcadia+Guild" alt="Guild Logo">
        <div class="welcome-card" id="display-welcome">
          Loading welcome message...
        </div>
      </section>

      <!-- SETTINGS VIEW -->
      <section id="view-settings" class="settings-grid" style="display: none;">
        <!-- Guild Customization -->
        <div class="settings-card">
          <h3>Guild Settings</h3>
          <div class="input-group">
            <label>Logo Image URL</label>
            <input type="text" id="input-logo-url" placeholder="https://example.com/logo.png" style="width:100%; padding:0.75rem; background:#0f172a; border:1px solid var(--border); border-radius:6px; color:#fff;">
          </div>
          <div class="input-group">
            <label>Welcome Message</label>
            <textarea id="input-welcome-msg" placeholder="Enter welcome message..."></textarea>
          </div>
          <button class="btn btn-sm" onclick="saveGuildSettings()">Save General Settings</button>
        </div>

        <!-- Create User -->
        <div class="settings-card">
          <h3>Add New Member</h3>
          <form id="create-user-form" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <div class="domain-input" style="flex: 1; min-width: 200px;">
              <input type="text" id="new-username" placeholder="Username" required>
              <span class="domain-addon">@arcadia.com</span>
            </div>
            <input type="password" id="new-password" placeholder="Password" required style="flex: 1; min-width: 150px;">
            <button type="submit" class="btn btn-sm" style="flex: 0 0 auto;">Create User</button>
          </form>
        </div>

        <!-- User Management Table -->
        <div class="settings-card">
          <h3>User Management</h3>
          <table class="user-table">
            <thead>
              <tr>
                <th>Username</th>
                <th>System Role</th>
                <th>Guild Role</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // Replace with your Firebase Project Config
    // ==========================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryApp");
    
    const auth = firebase.auth();
    const db = firebase.firestore();

    // System States
    let currentUserData = null;
    let score = 0;
    let bunnies = [];
    let bunnyInterval = null;
    let animFrame = null;
    let mousePos = { x: -100, y: -100 };

    // ==========================================
    // 2. CURSOR PARTICLE SYSTEM
    // ==========================================
    const canvas = document.getElementById('cursor-canvas');
    const ctx = canvas.getContext('2d');
    let cursorParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      mousePos.x = e.clientX;
      mousePos.y = e.clientY;

      // Spawn glowing trail particles on cursor move
      for (let i = 0; i < 3; i++) {
        cursorParticles.push({
          x: e.clientX,
          y: e.clientY,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3,
          size: Math.random() * 5 + 2,
          hue: Math.floor(Math.random() * 60 + 210), // Electric blue to purple hue range
          alpha: 1,
          decay: Math.random() * 0.03 + 0.025
        });
      }
    });

    function updateAndRenderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = cursorParticles.length - 1; i >= 0; i--) {
        let p = cursorParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.size *= 0.95;
        p.alpha -= p.decay;

        if (p.alpha <= 0 || p.size <= 0.5) {
          cursorParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = `hsl(${p.hue}, 100%, 65%)`;
        ctx.shadowColor = `hsl(${p.hue}, 100%, 50%)`;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ==========================================
    // 3. INTENSE BUNNY MINIGAME LOGIC
    // ==========================================
    const loginScreen = document.getElementById('login-screen');
    const scoreDisplay = document.getElementById('bunny-score');

    function initMinigame() {
      score = 0;
      sessionStorage.setItem('bunnyScore', 0);
      scoreDisplay.innerText = score;
      bunnies.forEach(b => b.element.remove());
      bunnies = [];

      clearInterval(bunnyInterval);
      cancelAnimationFrame(animFrame);

      bunnyInterval = setInterval(spawnBunny, 10000);
      spawnBunny();
      gameLoop();
    }

    function spawnBunny() {
      if (bunnies.length >= 10) return;

      const bunnyEl = document.createElement('div');
      bunnyEl.className = 'bunny';
      bunnyEl.innerText = '🐇';
      
      let x, y, safe = false;
      let attempts = 0;
      while (!safe && attempts < 50) {
        x = Math.random() * (window.innerWidth - 60);
        y = Math.random() * (window.innerHeight - 60);
        safe = bunnies.every(b => Math.hypot(b.x - x, b.y - y) > 60);
        attempts++;
      }

      bunnyEl.style.left = `${x}px`;
      bunnyEl.style.top = `${y}px`;

      const bunnyObj = {
        element: bunnyEl,
        x: x,
        y: y,
        vx: 0,
        vy: 0,
        isLaunched: false
      };

      bunnyEl.addEventListener('click', (e) => {
        e.stopPropagation();
        launchBunny(bunnyObj);
      });

      loginScreen.appendChild(bunnyEl);
      bunnies.push(bunnyObj);
    }

    function launchBunny(bunny) {
      if (bunny.isLaunched) return;
      bunny.isLaunched = true;
      bunny.element.classList.add('launched');
      bunny.element.innerText = '💥';
      
      const angle = Math.atan2(bunny.y - window.innerHeight / 2, bunny.x - window.innerWidth / 2);
      const force = 35 + Math.random() * 20;
      bunny.vx = Math.cos(angle) * force;
      bunny.vy = Math.sin(angle) * force;

      score++;
      sessionStorage.setItem('bunnyScore', score);
      scoreDisplay.innerText = score;
    }

    function gameLoop() {
      updateAndRenderParticles();

      bunnies.forEach((bunny, index) => {
        if (bunny.isLaunched) {
          bunny.x += bunny.vx;
          bunny.y += bunny.vy;
          bunny.element.style.transform = `scale(1.5) rotate(${bunny.x * 4}deg)`;
          bunny.element.style.left = `${bunny.x}px`;
          bunny.element.style.top = `${bunny.y}px`;

          if (bunny.x < -100 || bunny.x > window.innerWidth + 100 || 
              bunny.y < -100 || bunny.y > window.innerHeight + 100) {
            bunny.element.remove();
            bunnies.splice(index, 1);
          }
        } else {
          // Aggressive Pursuit Logic without Knockback
          const dx = mousePos.x - (bunny.x + 20);
          const dy = mousePos.y - (bunny.y + 20);
          const dist = Math.hypot(dx, dy);

          if (dist > 5) {
            bunny.x += (dx / dist) * 3.2; // Fast aggressive pursuit speed
            bunny.y += (dy / dist) * 3.2;
          }

          bunny.element.style.left = `${bunny.x}px`;
          bunny.element.style.top = `${bunny.y}px`;
        }
      });

      animFrame = requestAnimationFrame(gameLoop);
    }

    function stopMinigameAndClearCache() {
      clearInterval(bunnyInterval);
      cancelAnimationFrame(animFrame);
      bunnies.forEach(b => b.element.remove());
      bunnies = [];
      cursorParticles = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      score = 0;
      sessionStorage.removeItem('bunnyScore');
      scoreDisplay.innerText = 0;
    }

    // ==========================================
    // 4. AUTHENTICATION LOGIC
    // ==========================================
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const userVal = document.getElementById('login-username').value.trim();
      const email = userVal.includes('@') ? userVal : `${userVal}@arcadia.com`;
      const pass = document.getElementById('login-password').value;

      auth.signInWithEmailAndPassword(email, pass).catch(err => {
        alert("Login Failed: " + err.message);
      });
    });

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        stopMinigameAndClearCache();
        await fetchUserData(user);
        
        document.getElementById('login-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
        
        setupNavigation();
        loadGuildData();
      } else {
        document.getElementById('app-screen').classList.remove('active');
        document.getElementById('login-screen').classList.add('active');
        initMinigame();
      }
    });

    function logout() {
      auth.signOut();
    }

    async function fetchUserData(user) {
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists) {
        currentUserData = doc.data();
      } else {
        const isSuper = user.email === 'superadmin@arcadia.com';
        currentUserData = {
          uid: user.uid,
          email: user.email,
          username: user.email.split('@')[0],
          systemRole: isSuper ? 'superadmin' : 'guest',
          guildRole: isSuper ? 'Leader' : 'New Recruit'
        };
        await db.collection('users').doc(user.uid).set(currentUserData);
      }
    }

    // ==========================================
    // 5. NAVIGATION & PERMISSIONS
    // ==========================================
    function setupNavigation() {
      const settingsBtn = document.getElementById('nav-settings');
      if (['superadmin', 'admin'].includes(currentUserData.systemRole)) {
        settingsBtn.style.display = 'flex';
      } else {
        settingsBtn.style.display = 'none';
      }
      showView('home');
    }

    function showView(viewName) {
      if (viewName === 'settings' && !['superadmin', 'admin'].includes(currentUserData.systemRole)) {
        alert("Access Denied.");
        return;
      }

      document.getElementById('view-home').style.display = viewName === 'home' ? 'flex' : 'none';
      document.getElementById('view-settings').style.display = viewName === 'settings' ? 'grid' : 'none';
      
      document.getElementById('nav-home').classList.toggle('active', viewName === 'home');
      document.getElementById('nav-settings').classList.toggle('active', viewName === 'settings');

      if (viewName === 'settings') {
        loadUserTable();
      }
    }

    // ==========================================
    // 6. GUILD & USER MANAGEMENT (SETTINGS)
    // ==========================================
    function loadGuildData() {
      db.collection('settings').doc('guild').onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (data.logoUrl) document.getElementById('display-logo').src = data.logoUrl;
          if (data.welcomeMsg) document.getElementById('display-welcome').innerText = data.welcomeMsg;
          
          document.getElementById('input-logo-url').value = data.logoUrl || '';
          document.getElementById('input-welcome-msg').value = data.welcomeMsg || '';
        }
      });
    }

    async function saveGuildSettings() {
      if (!['superadmin', 'admin'].includes(currentUserData.systemRole)) return;

      const logoUrl = document.getElementById('input-logo-url').value;
      const welcomeMsg = document.getElementById('input-welcome-msg').value;

      await db.collection('settings').doc('guild').set({
        logoUrl,
        welcomeMsg
      }, { merge: true });

      alert('Guild settings updated successfully!');
    }

    document.getElementById('create-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!['superadmin', 'admin'].includes(currentUserData.systemRole)) return;

      const username = document.getElementById('new-username').value.trim();
      const email = `${username}@arcadia.com`;
      const pass = document.getElementById('new-password').value;

      try {
        const res = await secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
        await db.collection('users').doc(res.user.uid).set({
          uid: res.user.uid,
          email: email,
          username: username,
          systemRole: 'member',
          guildRole: 'New Recruit'
        });
        
        await secondaryApp.auth().signOut();
        document.getElementById('create-user-form').reset();
        alert(`User ${username}@arcadia.com created successfully!`);
        loadUserTable();
      } catch (err) {
        alert("Error creating user: " + err.message);
      }
    });

    async function loadUserTable() {
      const snapshot = await db.collection('users').get();
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '';

      snapshot.forEach(doc => {
        const u = doc.data();
        const tr = document.createElement('tr');

        const isSuperAdminUser = u.email === 'superadmin@arcadia.com' || u.systemRole === 'superadmin';
        const canEdit = currentUserData.systemRole === 'superadmin' || 
                       (currentUserData.systemRole === 'admin' && !isSuperAdminUser);

        tr.innerHTML = `
          <td><strong>${u.username}</strong><br><small style="color:var(--text-muted)">${u.email}</small></td>
          <td>
            <select ${!canEdit ? 'disabled' : ''} onchange="updateUserRole('${u.uid}', 'systemRole', this.value)">
              <option value="superadmin" ${u.systemRole === 'superadmin' ? 'selected' : ''} ${currentUserData.systemRole !== 'superadmin' ? 'disabled' : ''}>Superadmin</option>
              <option value="admin" ${u.systemRole === 'admin' ? 'selected' : ''}>Admin</option>
              <option value="member" ${u.systemRole === 'member' ? 'selected' : ''}>Member</option>
              <option value="guest" ${u.systemRole === 'guest' ? 'selected' : ''}>Guest</option>
            </select>
          </td>
          <td>
            <select ${!canEdit ? 'disabled' : ''} onchange="updateUserRole('${u.uid}', 'guildRole', this.value)">
              <option value="Leader" ${u.guildRole === 'Leader' ? 'selected' : ''}>Leader</option>
              <option value="Commander" ${u.guildRole === 'Commander' ? 'selected' : ''}>Commander</option>
              <option value="Officer" ${u.guildRole === 'Officer' ? 'selected' : ''}>Officer</option>
              <option value="Member" ${u.guildRole === 'Member' ? 'selected' : ''}>Member</option>
              <option value="New Recruit" ${u.guildRole === 'New Recruit' ? 'selected' : ''}>New Recruit</option>
            </select>
          </td>
          <td>
            ${canEdit && !isSuperAdminUser ? `<button class="btn btn-sm btn-danger" onclick="deleteUser('${u.uid}')">Remove</button>` : '<span style="color:var(--text-muted)">Protected</span>'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function updateUserRole(uid, field, value) {
      await db.collection('users').doc(uid).update({ [field]: value });
    }

    async function deleteUser(uid) {
      if (confirm('Are you sure you want to remove this user document?')) {
        await db.collection('users').doc(uid).delete();
        loadUserTable();
      }
    }
  </script>
</body>
</html>
